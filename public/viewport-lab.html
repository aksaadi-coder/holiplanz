<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Identical to the app's own, so what this page measures is what the app
         gets. Don't "tidy" it — viewport-fit=cover is load-bearing here. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Viewport lab" />
    <title>Viewport lab</title>
    <style>
      /* A measuring instrument, not a screen. Every colour here is a ruler.

         The question it answers in one screenshot: where does each way of
         saying "the bottom" actually land on this device, in this mode?
         The app's tab bar has been sitting above the true bottom and four
         different fixes have missed, all reasoned from screenshots rather
         than numbers. */
      * { box-sizing: border-box; margin: 0; }

      html, body { height: 100dvh; overflow: hidden; }
      body {
        background: #f6f4f1;
        color: #161410;
        font: 500 13px/1.5 ui-monospace, Menlo, monospace;
        -webkit-font-smoothing: antialiased;
      }

      /* RED — ground truth. A fixed strip on bottom:0 with no padding at all.
         Whatever else happens, this is the bottom of the viewport. */
      .truth {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: 6px;
        background: #e02d1b;
        z-index: 100;
      }

      /* BLUE — where a 100dvh column ends. This is what the app's shell does
         today. If blue sits above red, dvh is short by that much. */
      .dvh-col {
        position: fixed;
        left: 0; right: 0; top: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        pointer-events: none;
        z-index: 90;
      }
      .dvh-col .marker { height: 6px; background: #1b5ce0; }

      /* GREEN — where a 100svh column ends. */
      .svh-col {
        position: fixed;
        left: 0; right: 0; top: 0;
        height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        pointer-events: none;
        z-index: 80;
      }
      .svh-col .marker { height: 6px; background: #0f9d58; }

      /* AMBER — the safe-area inset drawn to scale, sitting on the true bottom.
         This is the band the tab bar currently reserves as padding. If the app's
         labels sit above a gap this tall, the inset is the culprit. */
      .safe-band {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: env(safe-area-inset-bottom);
        background: rgba(245, 166, 35, 0.5);
        border-top: 2px dashed #b8770a;
        z-index: 70;
      }

      /* A mock of the real tab bar, built exactly like the app's, so we can see
         where its labels land relative to the red line. */
      .mock-bar {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        background: #fff;
        border-top: 1px solid #e4ded2;
        padding-bottom: max(env(safe-area-inset-bottom), 6px);
        display: flex;
        justify-content: space-around;
        z-index: 60;
      }
      .mock-bar span { padding: 12px 0 7px; font-size: 13px; }

      .readout {
        position: fixed;
        top: env(safe-area-inset-top);
        left: 0; right: 0;
        background: rgba(22, 20, 16, 0.9);
        color: #f6f4f1;
        padding: 10px 12px;
        display: grid;
        grid-template-columns: auto auto;
        column-gap: 12px;
        row-gap: 2px;
        font-size: 13px;
        z-index: 110;
      }
      .readout b { text-align: right; font-weight: 700; }
      .readout .hi { color: #ff8a7a; }
      .legend {
        position: fixed;
        left: 12px;
        bottom: 130px;
        display: grid;
        gap: 6px;
        font-size: 12.5px;
        z-index: 110;
      }
      .legend div { display: flex; align-items: center; gap: 8px; }
      .swatch { width: 22px; height: 6px; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div class="safe-band"></div>
    <div class="mock-bar"><span>Home</span><span>Trips</span><span>Passport</span><span>Account</span></div>
    <div class="svh-col"><div class="marker"></div></div>
    <div class="dvh-col"><div class="marker"></div></div>
    <div class="truth"></div>

    <div class="legend">
      <div><i class="swatch" style="background:#e02d1b"></i> true bottom (fixed, bottom:0)</div>
      <div><i class="swatch" style="background:#1b5ce0"></i> end of 100dvh</div>
      <div><i class="swatch" style="background:#0f9d58"></i> end of 100svh</div>
      <div><i class="swatch" style="background:rgba(245,166,35,.7)"></i> safe-area-inset-bottom</div>
    </div>

    <div class="readout" id="out"></div>

    <script>
      // Probes: the only way to read what these units resolve to on the device.
      function probe(css) {
        const el = document.createElement('div');
        el.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:' + css;
        document.body.appendChild(el);
        const h = el.offsetHeight;
        el.remove();
        return h;
      }
      function insetBottom() {
        const el = document.createElement('div');
        el.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;padding-bottom:env(safe-area-inset-bottom)';
        document.body.appendChild(el);
        const h = el.offsetHeight;
        el.remove();
        return h;
      }

      function render() {
        const vv = window.visualViewport;
        const dvh = probe('100dvh'), svh = probe('100svh'), lvh = probe('100lvh');
        const inset = insetBottom();
        const bar = document.querySelector('.mock-bar').getBoundingClientRect();
        const standalone =
          window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        const rows = [
          ['mode', standalone ? 'HOME-SCREEN APP' : 'safari'],
          ['innerHeight', window.innerHeight],
          ['visualViewport', vv ? Math.round(vv.height) : 'n/a'],
          ['screen.height', window.screen.height],
          ['100dvh', dvh],
          ['100svh', svh],
          ['100lvh', lvh],
          ['dvh short by', window.innerHeight - dvh],
          ['safe-inset-bottom', inset],
          ['bar top', Math.round(bar.top)],
          ['bar bottom gap', Math.round(window.innerHeight - bar.bottom)],
          ['scrollY', Math.round(window.scrollY)],
        ];

        document.getElementById('out').innerHTML = rows
          .map(([k, v]) => {
            const hot = k === 'dvh short by' && v !== 0;
            return '<span' + (hot ? ' class="hi"' : '') + '>' + k + '</span><b' +
              (hot ? ' class="hi"' : '') + '>' + v + '</b>';
          })
          .join('');
      }

      render();
      addEventListener('resize', render);
      addEventListener('orientationchange', () => setTimeout(render, 300));
      visualViewport?.addEventListener('resize', render);
      setInterval(render, 500);
    </script>
  </body>
</html>
